version: "15.0"
description: Requirements for the Knit application.
directives:
  - id: E-1310.0
    dos:
      - Accept signed GitHub webhook events at the application endpoint.
      - Return HTTP 200 after Knit adds each valid signed webhook to its queue.
      - Return HTTP 503 immediately when the pending task queue is full.
      - Do not wait for event processing before the HTTP acknowledgement.
      - Check trusted target profiles before the application opens external connections.
      - Read repository workflows at the webhook commit.
      - Run approved commands through verified SSH targets.
      - Require one or more deployments in every configured action.
      - Send supported event and deployment updates to Discord.
      - Use the repository name after its owner slash as the Discord announcement channel name.
      - Do not add a hash or owner name to the channel name.
      - Lowercase repository names for channel names.
      - Keep letters, numbers, and hyphens in channel names.
      - Drop unsupported characters from channel names without replacement text.
      - Allow repositories with the same normalized channel name to share a channel.
      - Reject channel names longer than 100 characters. Keep their full length.
      - Check the guild channel list for that name for each event.
      - Use the matching announcement channel. Create one with that name if none exists.
      - If a different channel type has that name, create an announcement channel.
      - Set channel access from repository visibility before Knit posts an event.
      - Set the channel topic from package metadata before Knit posts an event.
      - Preserve keyword data when the channel topic reaches its length limit.
      - Reject keyword data above the channel topic limit.
      - Preserve the current channel topic when an event has no package metadata.
      - Give the Discord bot the Administrator permission.
      - Do not require the Discord bot in channel allowlists.
      - Use the Administrator permission to access private announcement channels.
      - Process each webhook request once.
      - End failed webhook processing without an automatic retry.
      - Deploy released container images through GitOps.
    donts:
      - Do not store runtime credentials in this repository.
      - Do not deploy mutable container tags.
      - Do not run unvalidated repository workflows.
    children:
      - id: E-1310.0.0
        dos:
          - Require a valid GitHub webhook signature before event processing.
          - Preserve request IDs during event processing.
          - Ignore events without a configured repository target.
          - Give unmatched tag events a neutral ignored result.
        donts:
          - Do not execute deployment commands from unsigned events.
          - Do not report a deployment when the repository target is missing.
      - id: E-1310.0.1
        dos:
          - Load target profiles from the configured YAML inventory.
          - Fetch workflow files from the exact webhook commit.
          - Validate target access and working-directory limits before SSH execution.
        donts:
          - Do not use a central repository workflow fallback.
          - Do not bypass strict SSH host verification.
      - id: E-1310.0.2
        dos:
          - Run aggregate repository validation through npm test.
          - Keep runtime secrets and private SSH keys outside Git.
          - Use immutable version tags for container deployment.
        donts:
          - Do not publish or deploy during local validation.
          - Do not expose secrets in command output.
