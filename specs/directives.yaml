version: "12.0"
description: Defines committed requirements for the Knit service.
directives:
  - id: E-1310.0
    dos:
      - Accept signed GitHub webhook events through the service endpoint.
      - Return HTTP 200 immediately after queueing each valid signed webhook.
      - Do not wait for event processing before the HTTP acknowledgement.
      - Validate trusted target profiles before the service opens external connections.
      - Read repository workflows at the webhook commit.
      - Run approved commands through verified SSH targets.
      - Require one or more deployments in every configured action.
      - Send supported event and deployment updates to Discord.
      - Use the repository name as the Discord announcement channel name.
      - Use only the repository name after the owner slash; do not add a hash or owner name.
      - Keep repository names unique within the eliware organization.
      - Encode punctuation in channel names so distinct repository names stay distinct.
      - Reject channel names longer than 100 characters; do not truncate them.
      - Check the guild channel list for that name on every event.
      - Reuse the matching announcement channel or create it with that name and no suffix.
      - Reuse only announcement channels; create an announcement channel when another type has that name.
      - Set channel access from repository visibility before Knit posts an event.
      - Set the channel topic from package metadata before Knit posts an event.
      - Preserve keyword metadata when the channel topic reaches its length limit.
      - Reject keyword metadata that exceeds the channel topic limit.
      - Give the Discord bot the Administrator permission.
      - Do not require the Discord bot in channel allowlists.
      - Use the Administrator permission to access private announcement channels.
      - Send each delivery to the consumer once.
      - End failed deliveries without an automatic retry.
      - Deploy released container images through GitOps.
    donts:
      - Do not store runtime credentials in this repository.
      - Do not deploy mutable container tags.
      - Do not run unvalidated repository workflows.
    children:
      - id: E-1310.0.0
        dos:
          - Require a valid GitHub webhook signature before event processing.
          - Preserve delivery identifiers through event processing.
          - Ignore events without a configured repository target.
        donts:
          - Do not execute deployment commands from unsigned events.
          - Do not treat a missing repository target as a successful deployment.
      - id: E-1310.0.1
        dos:
          - Load target profiles from the configured YAML inventory.
          - Fetch workflow files from the exact webhook commit.
          - Validate target access and working-directory limits before SSH execution.
        donts:
          - Do not use a central repository workflow fallback.
          - Do not bypass strict SSH host verification.
      - id: E-1310.0.2
        dos:
          - Run aggregate repository validation through npm test.
          - Keep runtime secrets and private SSH keys outside Git.
          - Use immutable version tags for container deployment.
        donts:
          - Do not publish or deploy during local validation.
          - Do not expose secrets in command output.
