services:
  knit:
    build: .
    ports:
      - "${PORT:-3456}:3456"
    env_file:
      - path: .env
        format: raw
    environment:
      KNIT_CONFIG_PATH: /etc/knit/config
    volumes:
      - ${KNIT_CONFIG_PATH:-./repos}:/etc/knit/config:ro
      - ${USERPROFILE}/.ssh/id_rsa:/run/secrets/eliware/ssh/id_rsa:ro
      - ${USERPROFILE}/.ssh/known_hosts:/run/secrets/eliware/ssh/known_hosts:ro
      - ${USERPROFILE}/.ssh/eliware_host_ca_ed25519.pub:/run/secrets/eliware/ssh/eliware_host_ca_ed25519.pub:ro
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    pull_policy: build
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3456/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
