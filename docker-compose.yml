services:
  knit:
    build: .
    ports:
      - "${PORT:-3456}:3456"
    env_file:
      - path: .env
        format: raw
    secrets:
      - knit_configs_deploy_key
      - knit_known_hosts
      - knit_configs_age_key
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3456/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  knit_configs_deploy_key:
    file: ${KNIT_CONFIG_DEPLOY_KEY_FILE:-/root/.ssh/knit-configs-deploy}
  knit_known_hosts:
    file: ${KNIT_CONFIG_KNOWN_HOSTS_FILE:-/root/.ssh/known_hosts}
  knit_configs_age_key:
    file: ${KNIT_AGE_IDENTITY_FILE:-/root/.config/sops/age/knit-configs-keys.txt}
