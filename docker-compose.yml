services:
  knit:
    build: .
    ports:
      - "${PORT:-3456}:3456"
    env_file:
      - path: .env
        format: raw
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    pull_policy: build
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3456/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
